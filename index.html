<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>MealPlan</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#171717;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0;padding-bottom:86px}header{padding:22px 18px 10px;position:sticky;top:0;background:#f5f5f7eF;backdrop-filter:blur(18px);z-index:3}
h1{margin:0;font-size:32px}h2{font-size:20px}.card,section{background:white;margin:10px 14px;padding:16px;border-radius:18px;box-shadow:0 1px 4px #00000010}
button,.btn{border:0;border-radius:12px;padding:11px 14px;font-size:16px;background:#e9e9ee;color:#111}button.primary{background:#111;color:white}button.danger{color:#b00020}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #ddd;border-radius:10px;background:white;margin:5px 0}
textarea{min-height:120px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.muted{color:#6b6b70;font-size:13px}.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fafafaeF;backdrop-filter:blur(18px);border-top:1px solid #ddd;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:5}
nav button{background:transparent;padding:7px 2px;font-size:11px;display:flex;flex-direction:column;gap:3px;align-items:center}nav button span{font-size:21px}
.recipe{padding:11px 0;border-bottom:1px solid #eee}.recipe:last-child{border:0}.pill{display:inline-block;padding:4px 8px;background:#eee;border-radius:999px;font-size:12px;margin:2px}
.day{border-left:4px solid #222;padding-left:12px;margin:14px 0}.shop{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eee}.shop input{width:auto}
img.photo{width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin-top:8px}
</style>
</head>
<body>
<header><h1 id="title">Planning</h1></header>
<main id="app"></main>
<nav>
<button data-tab="planning"><span>📅</span>Planning</button><button data-tab="recipes"><span>📖</span>Recepten</button>
<button data-tab="list"><span>🛒</span>Lijst</button><button data-tab="ideas"><span>💡</span>Ideeën</button>
<button data-tab="settings"><span>⚙️</span>Instellingen</button>
</nav>
<script src="app.js"></script>
</body></html>
